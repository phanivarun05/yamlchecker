version: 2

builds:
  - env:
    - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/phanivarun05/yamlchecker/cmd.version={{ .Tag }}

archives:
  - formats: [tar.gz] 

    format_overrides:
      - goos: windows
        formats: [zip]

    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"